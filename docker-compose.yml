services:
  adguard-ai:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: adguard-home-ai
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - ADGUARD_URL=http://192.168.100.23:8081
      - ADGUARD_USERNAME=samuel
      - ADGUARD_PASSWORD=sua_senha_adguard
      - OPENCODE_BIN=/home/samuel/.opencode/bin/opencode
      - OPENCODE_HOME=/home/samuel
      - OPENCODE_DIR=/home/samuel/opencode
      - OPENCODE_MODEL=opencode/big-pickle
      - OPENCODE_AGENT=plan
    volumes:
      - ./data:/app/data
