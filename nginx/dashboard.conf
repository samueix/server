# ==============================================================================
# Configuração Nginx para Ubuntu Server
# Arquivo: /etc/nginx/sites-available/server-panel
# Hostname: samuelserver | IP: 192.168.100.23
# ==============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name 192.168.100.23 samuelserver localhost dashboard.local _ ;

    # 1. Frontend React compilado publicado em /var/www/server-panel
    location / {
        root /var/www/server-panel;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # 2. Server Panel API (Node.js porta 3000 com telemetria, logs, n8n e AdGuard)
    location /api/ {
        proxy_pass http://127.0.0.1:3000;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts para telemetria
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # 3. AdGuard Home Proxy - passa pelo Node para autenticação/autorização do painel
    # O Node injeta credenciais do AdGuard e aplica RBAC (leitura: user/admin, escrita: admin)
    location /adguard-api/ {
        proxy_pass http://127.0.0.1:3000;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # 4. Suporte a WebSocket de telemetria se necessário
    location /ws {
        proxy_pass http://127.0.0.1:8000/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
    }
}
