# Configuração Nginx para Ubuntu Server (/etc/nginx/sites-available/dashboard)
# Painel NOC & Proxy Seguro AdGuard Home

server {
    listen 80; # Ou 443 com SSL
    server_name dashboard.local 192.168.100.23 localhost;

    # Frontend estático construído (npm run build -> dist)
    location / {
        root /var/www/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Proxy reverso inteligente para a API do AdGuard Home (:8081)
    # O Proxy injeta a autenticação no backend, o frontend NUNCA vê a senha
    location /adguard-api/ {
        # Reescreve e envia para a porta interna 8081
        proxy_pass http://192.168.100.23:8081/control/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Injeção segura de credenciais no nível do servidor (Basic Auth samuel:12345678)
        proxy_set_header Authorization "Basic c2FtdWVsOjEyMzQ1Njc4";

        # Liberação de CORS para permitir acesso direto do navegador sem bloqueio
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept, X-Requested-With' always;

        # Resposta imediata para preflight OPTIONS
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*';
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS';
            add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept, X-Requested-With';
            add_header 'Content-Length' 0;
            add_header 'Content-Type' 'text/plain';
            return 204;
        }

        # Desativa buffering para telemetria em tempo real
        proxy_buffering off;
        proxy_read_timeout 60s;
        proxy_connect_timeout 5s;
    }

    # Proxy reverso para a API Python de telemetria do Ubuntu (:8000)
    location /api/ {
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Suporte a WebSocket em tempo real (:8000/ws)
    location /ws {
        proxy_pass http://127.0.0.1:8000/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
    }
}
