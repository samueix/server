# ==============================================================================
# Configuração Nginx para Ubuntu Server
# Arquivo: /etc/nginx/sites-available/server-panel
# Hostname: samuelserver | IP: 192.168.100.23
# ==============================================================================

server {
    listen 80;
    server_name 192.168.100.23 samuelserver localhost dashboard.local;

    # 1. Frontend React compilado publicado em /var/www/server-panel
    location / {
        root /var/www/server-panel;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # 2. Server Panel API (Node.js porta 3000 com telemetria, logs, n8n e AdGuard)
    location /api/ {
        proxy_pass http://127.0.0.1:3000;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts para telemetria
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # 3. AdGuard Home Proxy (porta 8081)
    # O frontend solicita /adguard-api/stats, /adguard-api/status e /adguard-api/querylog
    # O Nginx reescreve para http://127.0.0.1:8081/control/ e injeta a autenticação
    location /adguard-api/ {
        proxy_pass http://127.0.0.1:8081/control/;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Injeção segura de credenciais HTTP Basic no nível do servidor (samuel:12345678)
        # O frontend NUNCA vê a senha e o navegador nunca solicita pop-up
        proxy_set_header Authorization "Basic c2FtdWVsOjEyMzQ1Njc4";

        # Evita buffering para respostas DNS rápidas
        proxy_buffering off;
        proxy_connect_timeout 4s;
        proxy_read_timeout 20s;
    }

    # 4. Suporte a WebSocket de telemetria se necessário
    location /ws {
        proxy_pass http://127.0.0.1:8000/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
    }
}
